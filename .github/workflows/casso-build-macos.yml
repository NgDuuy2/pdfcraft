# Casso: build PdfCraft for macOS on a GitHub-hosted Mac and upload the .dmg as an artifact.
# Runs on pushes to the casso-macos branch (the upstream workflows only run on main/release) or by hand.
# The app is ad-hoc signed (no Apple Developer ID), so Gatekeeper asks before the first launch.
name: Casso – build macOS

on:
  push:
    branches: [casso-macos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon; package.sh builds both arm64 and x86_64 and joins them with lipo
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build, ad-hoc sign and package (.app → .dmg + CLI zip)
        run: bash packaging/macos/package.sh --arch universal

      - name: Smoke test
        run: |
          file target/macos-package/bin/pdfcraft
          lipo -info target/macos-package/bin/pdfcraft
          target/macos-package/bin/pdfcraft-cli --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-macos-universal
          path: |
            dist/release/*.dmg
            dist/release/*.zip
          retention-days: 14
